<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Wellington Costa — IT support and software development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c18"/>
      <stop offset="0.55" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#090f1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.98" cy="1" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#grid)"/>
  <rect width="1200" height="330" fill="url(#glow1)"/>
  <rect width="1200" height="330" fill="url(#glow2)"/>

  <!-- monogram -->
  <rect x="72" y="66" width="62" height="62" rx="17" fill="#0d1a2e" stroke="url(#accent)" stroke-width="1.6"/>
  <text x="103" y="104" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="700" fill="url(#accent)" letter-spacing="1">WC</text>
  <text x="150" y="92" font-family="Consolas, Menlo, monospace" font-size="12"
        fill="#5b7396" letter-spacing="2.4">PROFILE</text>
  <text x="150" y="112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="14" fill="#7f95b8">Rio Claro / RJ · Brazil</text>

  <!-- name -->
  <text x="72" y="196" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" fill="#e9effd" letter-spacing="-1">Wellington G. Costa</text>
  <text x="72" y="236" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19.5" fill="#8ba1c2">IT support · Infrastructure · Software that removes manual work</text>

  <!-- meta -->
  <circle cx="78" cy="277" r="4.5" fill="#22d3ee"/>
  <text x="94" y="282" font-family="Consolas, Menlo, monospace" font-size="14"
        fill="#6c83a5">github.com/wellrccity</text>
  <circle cx="286" cy="277" r="3" fill="#33465f"/>
  <text x="302" y="282" font-family="Consolas, Menlo, monospace" font-size="14"
        fill="#6c83a5">python · typescript · node</text>

  <!-- terminal -->
  <rect x="748" y="66" width="380" height="216" rx="16" fill="#0a1220" stroke="#1d2d47" stroke-width="1.2"/>
  <circle cx="772" cy="90" r="4.5" fill="#ff5f57"/>
  <circle cx="790" cy="90" r="4.5" fill="#febc2e"/>
  <circle cx="808" cy="90" r="4.5" fill="#28c840"/>
  <text x="1108" y="95" text-anchor="end" font-family="Consolas, Menlo, monospace"
        font-size="11" fill="#546a8c">zsh</text>
  <line x1="748" y1="110" x2="1128" y2="110" stroke="#17263c" stroke-width="1"/>

  <text x="774" y="142" font-family="Consolas, Menlo, monospace" font-size="14" fill="#22d3ee">$ whoami</text>
  <text x="774" y="164" font-family="Consolas, Menlo, monospace" font-size="14" fill="#cfe0f7">it support &amp; developer</text>
  <text x="774" y="194" font-family="Consolas, Menlo, monospace" font-size="14" fill="#22d3ee">$ stack</text>
  <text x="774" y="216" font-family="Consolas, Menlo, monospace" font-size="14" fill="#cfe0f7">python · typescript · node</text>
  <text x="774" y="246" font-family="Consolas, Menlo, monospace" font-size="14" fill="#a78bfa">$ focus</text>
  <text x="774" y="268" font-family="Consolas, Menlo, monospace" font-size="14" fill="#cfe0f7">automating the boring parts</text>

  <rect x="0" y="327" width="1200" height="3" fill="url(#accent)" opacity="0.85"/>
</svg>
